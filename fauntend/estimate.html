            const serviceSelect = document.getElementById("tdc-service-select"),
              optionSelect = document.getElementById("tdc-option-select"),
              optionWrapper = document.getElementById("tdc-option-wrapper"),
              qtySelect = document.getElementById("tdc-qty-select"),
              priceDisplay = document.getElementById("tdc-price-display");

            // ফাংশন: প্রথম ড্রপডাউন পপুলেট করা
            function populateServices() {
              serviceSelect.innerHTML = ""; // রিসেট
              Object.keys(tdcData).forEach(service => {
                serviceSelect.innerHTML += `<option value="${service}">${service}</option>`;
              });
            }

            // ফাংশন: অপশন লোড করা
            function loadOptions() {
              const selectedService = serviceSelect.value;

              // সেফটি চেক
              if (!selectedService || !tdcData[selectedService]) return;

              const options = Object.keys(tdcData[selectedService]);

              optionSelect.innerHTML = "";
              qtySelect.value = "1";

              if (options.length === 1) {
                optionWrapper.classList.add("tdc-calc-iso-hidden");
                optionSelect.innerHTML = `<option value="${options[0]}">${options[0]}</option>`;
              } else {
                optionWrapper.classList.remove("tdc-calc-iso-hidden");
                options.forEach(option => {
                  optionSelect.innerHTML += `<option value="${option}">${option}</option>`;
                });
              }

              calculatePrice();
            }

            // ফাংশন: প্রাইস ক্যালকুলেট করা
            function calculatePrice() {
              if (!serviceSelect.value || !optionSelect.value || !qtySelect.value) return;

              const quantity = parseInt(qtySelect.value);
              const serviceData = tdcData[serviceSelect.value];

              if (!serviceData) return;

              const priceArray = serviceData[optionSelect.value];

              if (!priceArray || priceArray.length !== 2) {
                priceDisplay.innerText = "N/A";
                return;
              }

              const [minPrice, maxPrice] = priceArray;

              let finalPriceText;
              if (minPrice === maxPrice) {
                finalPriceText = `৳ ${(minPrice * quantity).toLocaleString("en-BD")}`;
              } else {
                finalPriceText = `৳ ${(minPrice * quantity).toLocaleString("en-BD")} – ${(maxPrice * quantity).toLocaleString("en-BD")}`;
              }

              priceDisplay.innerText = finalPriceText;

              // অ্যানিমেশন
              priceDisplay.classList.remove("tdc-animate-pulse");
              void priceDisplay.offsetWidth;
              priceDisplay.classList.add("tdc-animate-pulse");
            }

            // ইভেন্ট লিসেনার যোগ করা (HTML onclick এর বদলে)
            serviceSelect.addEventListener('change', loadOptions);
            optionSelect.addEventListener('change', calculatePrice);
            qtySelect.addEventListener('change', calculatePrice);

            loadOptions();
